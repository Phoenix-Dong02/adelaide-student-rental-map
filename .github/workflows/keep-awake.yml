name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'   # the workflow will run every 6 hours
  workflow_dispatch:         

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" https://rentmapau.com